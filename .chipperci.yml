version: 1

environment:
  php: 8.4
  node: 20

on:
  push:
    branches: main
  pull_request:
    target:
      - main
      - dev

pipeline:
  - name: Setup & Install
    cmd: |
      # Upgrade before Composer reads Chipper's GitHub App token.
      sudo -H env -u COMPOSER_AUTH composer self-update 2.10.3
      composer --version

      cp .env.example .env
      composer config http-basic.composer.fluxui.dev "$FLUX_USERNAME" "$FLUX_LICENSE_KEY"
      composer install --no-interaction --prefer-dist --optimize-autoloader
      php artisan key:generate --ansi --force

      npm ci
      npm run build

  - name: Run Tests
    cmd: php artisan test --compact
